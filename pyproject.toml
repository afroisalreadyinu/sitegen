[project]
name = "sitegen"
version = "0.0.1"
description = "A static site generator"
readme = "README.md"
authors = [
    { name = "Ulas Turkmen", email = "ulas.tuerkmen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chardet>=7.6.0",
    "click>=8.5.0",
    "furl>=2.1.4",
    "jinja2>=3.1.6",
    "markdown>=3.11.1",
    "markupsafe>=3.0.4",
    "pygments>=2.21.0",
    "rfeed>=1.1.1",
    "schema>=0.7.8",
    "watchdog>=6.0.0",
]
license = "MIT"

[project.scripts]
sitegen = "sitegen.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "feedparser>=6.0.14",
    "isort>=9.0.2",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
]
